[project]
name = "elogbook-ai-service"
version = "0.1.0"
description = "AI/ML backend for the E-Logbook platform (RAG QA, guardrails, orchestration)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "uvicorn[standard]>=0.30",
    "pyjwt>=2.9",
    # Required by FastAPI to parse multipart/form-data (the /stt/transcribe upload).
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# The speech stack (ctranslate2, onnxruntime, PyAV, numpy) is several hundred megabytes
# and only needed where STT_BACKEND=faster_whisper actually runs. Install with
# `uv sync --extra stt`; the default install serves /stt/transcribe from the stub.
stt = ["faster-whisper>=1.2"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "eval: retrieval and pipeline-contract evaluation suite (tests/eval). Runs by default - it is deterministic, offline and sub-second. Use -m 'not eval' to skip it.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

# Absent from the default install (see the `stt` extra), so its lazy import in
# FasterWhisperAdapter has no stubs to check against.
[[tool.mypy.overrides]]
module = "faster_whisper.*"
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
